[project]
name = "agentshield"
version = "0.1.0"
description = "Autonomous Multi-Agent Framework for Multi-Cloud Infrastructure-as-Code Security"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.scripts]
agentshield = "agentshield.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
