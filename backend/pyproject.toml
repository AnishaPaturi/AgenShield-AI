[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield-ai"
version = "0.1.0"
description = "Autonomous Multi-Agent Framework for Multi-Cloud Infrastructure-as-Code Security"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "AgentShield Team", email = "team13@agentshield.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",

    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.10.0",

    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "requests>=2.32.0",

    "pypdf>=4.2.0",
    "pyyaml>=6.0",
    "python-hcl2>=0.3.0",
    "typing-extensions>=4.10.0",
    "numpy>=2.0.0",

    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
